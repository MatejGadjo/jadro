services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://news:${POSTGRES_PASSWORD}@postgres:5432/newsaggregator?sslmode=disable
      REDIS_URL: redis://redis:6379
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      INGEST_CRON: ${INGEST_CRON:-*/15 * * * *}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3 * * *}
      CLEANUP_RETENTION_DAYS: ${CLEANUP_RETENTION_DAYS:-3}
      # Web Push — empty VAPID keys disable push entirely. Set keys (make vapid)
      # in the root .env to enable. PUSH_CRON is evaluated in PUSH_TIMEZONE.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:kontakt@jadro.mk}
      PUSH_CRON: ${PUSH_CRON:-0 9 * * *}
      PUSH_TIMEZONE: ${PUSH_TIMEZONE:-Europe/Skopje}
      PUSH_MIN_SOURCES: ${PUSH_MIN_SOURCES:-3}
      ONNX_RUNTIME_LIB_PATH: /app/models/onnxruntime-linux-x64-1.23.2/lib/libonnxruntime.so
      ONNX_MODEL_PATH: /app/models/paraphrase-multilingual-MiniLM-L12-v2/model.onnx
      ONNX_TOKENIZER_PATH: /app/models/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json
    volumes:
      - ./backend/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: newsaggregator
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Loopback-only — not reachable externally, only via SSH tunnel or from
      # the VPS itself. Do not change to a public bind (0.0.0.0).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d newsaggregator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru

volumes:
  postgres_data:

networks:
  # Pin the default network subnet so it never drifts on a network teardown +
  # recreate. The backend's SetTrustedProxies (internal/rest/server.go) hardcodes
  # this range to trust X-Forwarded-For from the nginx container — if Docker
  # auto-assigned a different subnet, ClientIP() would fall back to the nginx
  # container IP and per-IP rate limiting would silently collapse to one bucket.
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
