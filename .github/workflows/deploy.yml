name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

# Never run two deploys at once; let a running one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-backend:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: backend
        run: go test ./...

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    # Only the upstream repository deploys; forks skip this job. Set up a
    # "production" environment with required reviewers to gate each deploy.
    if: github.repository_owner == 'MatejGadjo'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_DIR }}
            # fetch + reset (not pull) so deploys keep working after history
            # rewrites; untracked files like .env and models/ are untouched.
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f
            # nginx.conf is a SINGLE-FILE bind mount. `git pull` replaces the
            # file with a new inode, but the running container stays bound to
            # the old inode — so `nginx -s reload` (and `restart`) keep reading
            # stale config. Only recreating the container re-binds the mount to
            # the current inode. Force-recreate nginx every deploy so config
            # changes always take effect (~1s downtime).
            docker compose up -d --force-recreate nginx
