name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please don't file it here. See SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. make up\n2. open /sport\n3. ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `make logs` or the browser console. Remove anything private.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "commit abc123, Docker 27, macOS arm64"
