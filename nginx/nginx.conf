# Search-engine + social/LLM link crawlers. Matched UAs get server-rendered
# HTML from the backend /_prerender endpoint (so they don't receive the empty
# SPA shell); everyone else gets the normal SPA. This is dynamic rendering with
# equivalent content (Google-compliant), not cloaking. Set in http context
# (this file is included inside http via conf.d).
map $http_user_agent $is_crawler {
    default                                                                                                     0;
    "~*(googlebot|google-inspectiontool|google-extended|storebot-google|bingbot|duckduckbot|yandexbot|baiduspider|applebot|facebookexternalhit|facebot|twitterbot|telegrambot|viberbot|whatsapp|slackbot|linkedinbot|discordbot|redditbot|pinterest|gptbot|chatgpt-user|oai-searchbot|perplexitybot|claudebot|claude-web|anthropic-ai|amazonbot|bytespider)" 1;
}

# --- Real client IP ---------------------------------------------------------
# Requests reach this container through trusted hops: the host's TLS proxy via
# the Docker gateway and, optionally, a CDN. Walk X-Forwarded-For from the
# right, skipping trusted hops, so $remote_addr becomes the real visitor. A
# client-supplied X-Forwarded-For can't spoof this: only trusted hops are
# skipped, and the first untrusted address wins.
set_real_ip_from 172.18.0.0/16;
set_real_ip_from 127.0.0.1;
# Behind a CDN, add its IP ranges here (see nginx/real-ip.d/README.md).
include /etc/nginx/real-ip.d/*.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Abuse limits (per real client IP) --------------------------------------
# First line of defence in front of the backend's Redis limiter. Generous
# enough for a page load (several API calls at once), tight enough to stop a
# single client from hammering the API or the server-rendered crawler pages.
limit_req_zone  $binary_remote_addr zone=api:10m        rate=10r/s;
limit_req_zone  $binary_remote_addr zone=prerender:10m  rate=2r/s;
limit_req_zone  $crawler_key        zone=crawler:10m    rate=2r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

map $is_crawler $crawler_key {
    0 "";
    1 $binary_remote_addr;
}

server {
    listen 80;
    server_tokens off;
    limit_conn perip 30;

    # Docker's embedded DNS — re-resolve upstream hostnames instead of
    # caching the IP for the life of the nginx process. Required so a
    # container recreate (new IP) doesn't strand nginx pointing at a dead
    # address until someone notices and restarts it.
    resolver 127.0.0.11 valid=10s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Extra script/connect origins (e.g. an analytics provider) come from the
    # CSP_SCRIPT_SRC / CSP_CONNECT_SRC env vars; the nginx image substitutes
    # them at startup (this file is mounted as a template, see compose).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_SCRIPT_SRC}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ${CSP_CONNECT_SRC};" always;

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 16k;

        # proxy_pass through a variable forces nginx to use the `resolver`
        # directive on every request (subject to its TTL) instead of doing
        # a one-time static resolution at startup.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Dynamic sitemap is generated by the backend. Exact-match wins over the
    # `.xml` asset regex below, so this overrides any static /sitemap.xml.
    location = /sitemap.xml {
        limit_req zone=prerender burst=10 nodelay;
        set $sitemap_upstream http://backend:8080;
        proxy_pass $sitemap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets are always the SPA, never prerendered — keeps a crawler that
    # requests /assets/*.js etc. from being routed into /_prerender. Regex
    # locations are evaluated before the prefix "location /" below.
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|map|json|xml|txt|webmanifest|mp4|webm)$ {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # Fork by user-agent: humans → SPA (frontend), crawlers → backend
        # /_prerender<path>. The `if` only sets variables (a safe use of `if`);
        # the single proxy_pass stays outside it. Variable proxy_pass also keeps
        # the resolver-based re-resolution behaviour used elsewhere.
        set $page_upstream http://frontend:80;
        set $page_uri $request_uri;
        # Only crawler requests hit the backend here; the zone key is empty for
        # humans, and nginx doesn't count requests with an empty key.
        limit_req zone=crawler burst=10 nodelay;
        if ($is_crawler) {
            set $page_upstream http://backend:8080;
            set $page_uri /_prerender$request_uri;
        }
        proxy_pass $page_upstream$page_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
