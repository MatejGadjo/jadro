server {
    listen 80;

    # Docker's embedded DNS — re-resolve upstream hostnames instead of
    # caching the IP for the life of the nginx process. Required so a
    # container recreate (new IP) doesn't strand nginx pointing at a dead
    # address until someone notices and restarts it. See PRODUCTION.md
    # "Config / Ops Tweaks" for the 2026-06-16 incident this fixes.
    resolver 127.0.0.11 valid=10s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cloudflareinsights.com;" always;

    location /api/ {
        # proxy_pass through a variable forces nginx to use the `resolver`
        # directive on every request (subject to its TTL) instead of doing
        # a one-time static resolution at startup.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
